name: Package Linux

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build the Linux package
        run: make package-linux

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: asteroids-linux-x86_64
          path: dist/linux/asteroids-linux-x86_64.zip
          if-no-files-found: error

      - name: Publish release package
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/linux/asteroids-linux-x86_64.zip --clobber
          else
            gh release create "$RELEASE_TAG" dist/linux/asteroids-linux-x86_64.zip --generate-notes
          fi
